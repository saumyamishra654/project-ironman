<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1620">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <title>Project Ironman — HIM Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
(function() {
  var parts = location.pathname.split("/").filter(Boolean);
  if (parts.length && parts[parts.length - 1].indexOf(".") !== -1) parts.pop();
  window.APP_BASE = parts.length ? "/" + parts.join("/") + "/" : "/";
  window.appUrl = function(path) { return APP_BASE + String(path).replace(/^\//, ""); };
})();
  </script>
  <style>
    :root {
      --bg: #0f1620;
      --surface: #16212e;
      --surface-2: #1d2b3a;
      --surface-3: #24384a;
      --border: #2a3b4d;
      --text: #e8f0f7;
      --muted: #8ba3b8;
      --faint: #5f7488;
      --accent: #22d3ee;
      --accent-glow: rgba(34, 211, 238, 0.12);
      --run: #4ade80;
      --swim: #22d3ee;
      --bike: #fbbf24;
      --strength: #a78bfa;
      --rest: #64748b;
      --amber: #fbbf24;
      --red: #f0785f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      background: var(--bg);
      color: var(--text); line-height: 1.55; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    a { color: var(--accent); }

    /* Header */
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem 0 1.25rem; }
    .brand { display: flex; align-items: center; gap: 0.7rem; }
    .brand h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand h1 span { color: var(--accent); }
    .brand .sub { color: var(--muted); font-size: 0.82rem; margin-top: 0.1rem; }
    .legend { display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap; }
    .legend .pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .legend .swatch { width: 9px; height: 9px; border-radius: 3px; }
    .weekchip { background: var(--accent); color: #04141a; font-weight: 800; font-size: 0.85rem; padding: 0.45rem 0.9rem; border-radius: 6px; white-space: nowrap; }
    .weeknav { display: inline-flex; align-items: center; gap: 0.4rem; }
    .weeknav button { font-family: inherit; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; width: 1.8rem; height: 1.8rem; cursor: pointer; font-size: 1rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .weeknav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .weeknav button:disabled { opacity: 0.3; cursor: default; }
    .weeknav .weekchip.other { background: var(--surface-3); color: var(--text); cursor: pointer; }
    .weeknav .weekchip.other:hover { color: var(--accent); }

    .section { margin-top: 2.25rem; }
    .section > h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.13em; color: var(--muted); font-weight: 700; margin-bottom: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
    .section > h2 .rule { flex: 1; height: 1px; background: var(--border); }

    /* This week */
    .week-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 0.85rem; flex-wrap: wrap; }
    .week-head .phase { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .week-head .phase small { color: var(--muted); font-weight: 500; font-size: 0.85rem; margin-left: 0.5rem; }
    .week-head .focus { color: var(--muted); font-size: 0.85rem; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.6rem; }
    @media (max-width: 820px) { .week-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 460px) { .week-grid { grid-template-columns: 1fr; } }
    .day {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem 0.75rem;
      position: relative; overflow: hidden; min-height: 132px; display: flex; flex-direction: column;
    }
    .day::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--sport, var(--border)); }
    .day.today { border-color: var(--accent); }
    .day .dow { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .day.today .dow .now { color: var(--accent); }
    .day .sessions { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.55rem; }
    .sess { }
    .sess + .sess { border-top: 1px solid var(--border); padding-top: 0.5rem; }
    .sess-head { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.63rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sport); }
    .sess-head .ico { font-size: 0.82rem; }
    .sess-head .slot { color: var(--faint); margin-left: 0.15rem; }
    .sess-head { display: flex; }
    .sess-ttl { font-size: 0.84rem; font-weight: 600; line-height: 1.22; margin: 0.15rem 0 0.2rem; }
    .sess-tgt { font-size: 0.72rem; color: var(--muted); line-height: 1.35; }
    .sess-status { font-size: 0.56rem; font-weight: 800; letter-spacing: 0.03em; padding: 0.08rem 0.32rem; border-radius: 4px; margin-left: auto; text-transform: uppercase; white-space: nowrap; align-self: flex-start; }
    .sess-status.done { background: rgba(74,222,128,0.18); color: var(--run); }
    .sess-status.missed { background: rgba(240,120,95,0.18); color: var(--red); }
    .sess-status.modified { background: rgba(251,191,36,0.18); color: var(--amber); }
    .sess.missed .sess-ttl, .sess.missed .sess-tgt { text-decoration: line-through; opacity: 0.5; }

    /* Session log & insights */
    .log-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .log { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .log[open] { border-color: var(--sport, var(--border)); }
    .log > summary { list-style: none; cursor: pointer; padding: 0.8rem 1rem 0.8rem 1.15rem; display: flex; align-items: center; gap: 0.85rem; position: relative; }
    .log > summary::-webkit-details-marker { display: none; }
    .log > summary::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--sport, var(--border)); }
    .log .ld { font-size: 0.68rem; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; min-width: 3.4rem; }
    .log .lt { font-weight: 600; font-size: 0.88rem; flex: 1; line-height: 1.2; }
    .log .lt small { display: block; color: var(--faint); font-weight: 400; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.1rem; }
    .log .lv { font-size: 0.68rem; color: var(--sport); font-weight: 700; text-align: right; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em; }
    .log .chev { color: var(--faint); font-size: 0.8rem; transition: transform 0.15s ease; }
    .log[open] .chev { transform: rotate(90deg); }
    @media (max-width: 560px) { .log .lv { display: none; } }
    .log-body { padding: 0 1.15rem 1rem; }
    .log-stats { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.1rem 0 0.85rem; }
    .log-stats .st { background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 0.28rem 0.55rem; font-size: 0.72rem; font-variant-numeric: tabular-nums; }
    .log-stats .st span { color: var(--muted); }
    .log-stats .st b { color: var(--text); font-weight: 700; margin-left: 0.25rem; }
    .log-hl { font-size: 0.82rem; color: var(--text); font-weight: 600; line-height: 1.4; margin-bottom: 0.55rem; }
    .log-insight { list-style: none; }
    .log-insight li { font-size: 0.79rem; color: var(--muted); padding: 0.28rem 0 0.28rem 1.1rem; position: relative; line-height: 1.48; }
    .log-insight li::before { content: '▸'; position: absolute; left: 0; color: var(--sport); }

    /* Metrics */
    .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; }
    .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; position: relative; }
    .metric .ml { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; display: flex; align-items: center; gap: 0.35rem; }
    .metric .mv { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.2rem; }
    .metric .mv .u { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-left: 0.15rem; }
    .metric .mv .up { color: var(--run); font-size: 0.95rem; margin-left: 0.25rem; }
    .metric .mn { font-size: 0.7rem; color: var(--faint); margin-top: 0.3rem; line-height: 1.35; }
    .metric .bar { height: 5px; background: var(--surface-3); border-radius: 3px; margin-top: 0.55rem; overflow: hidden; }
    .metric .bar > span { display: block; height: 100%; border-radius: 3px; background: var(--strength); }
    .metric .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sport, var(--accent)); }

    .grid-races { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
    .race { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.15rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .race .rl .pri { font-size: 0.64rem; font-weight: 800; letter-spacing: 0.05em; padding: 0.1rem 0.45rem; border-radius: 6px; }
    .race .rl .pri.A { background: rgba(240,120,95,0.18); color: var(--red); }
    .race .rl .pri.B { background: var(--accent-glow); color: var(--accent); }
    .race .rl .rn { font-weight: 700; font-size: 1rem; margin-top: 0.3rem; }
    .race .rl .rr { font-size: 0.74rem; color: var(--muted); margin-top: 0.15rem; }
    .race .cd { text-align: right; }
    .race .cd .n { font-size: 1.9rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
    .race .cd .l { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

    /* Block */
    .phase-bands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
    @media (max-width: 720px) { .phase-bands { grid-template-columns: 1fr; } }
    .band { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.85rem 1rem; border-top: 3px solid var(--accent); }
    .band.active { background: var(--accent-glow); border-color: var(--accent); }
    .band .bp { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
    .band .bn { font-size: 1.05rem; font-weight: 700; margin: 0.15rem 0 0.3rem; }
    .band .bnote { font-size: 0.74rem; color: var(--muted); }

    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
    @media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; }
    .chart-card h3 { font-size: 0.82rem; font-weight: 650; margin-bottom: 0.7rem; display: flex; align-items: center; gap: 0.4rem; }
    .chart-card canvas { max-height: 240px; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 0.82rem; min-width: 640px; }
    th { text-align: left; padding: 0.6rem 0.85rem; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); background: var(--surface-2); font-weight: 700; white-space: nowrap; }
    td { padding: 0.55rem 0.85rem; border-top: 1px solid var(--border); vertical-align: top; }
    tr:hover td { background: var(--surface-2); }
    tr.deload td { background: rgba(251,191,36,0.06); }
    tr.current td { background: var(--accent-glow); }
    tr.current td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
    tr.past td { opacity: 0.5; }
    .badge { font-size: 0.6rem; font-weight: 800; letter-spacing: 0.04em; padding: 0.08rem 0.4rem; border-radius: 5px; margin-left: 0.35rem; }
    .badge.now { background: var(--accent); color: #04141a; }
    .badge.dl { background: rgba(251,191,36,0.18); color: var(--amber); }
    .sp { color: var(--run); font-weight: 600; }
    .sw { color: var(--swim); font-weight: 600; }

    /* Swim reference */
    .swim-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 720px) { .swim-cols { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.2rem; }
    .card h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.6rem; color: var(--swim); }
    .zone-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .zone-row:last-child { border-bottom: none; }
    .zone-row .zl { font-weight: 600; font-size: 0.85rem; }
    .zone-row .zl small { display: block; color: var(--faint); font-weight: 400; font-size: 0.72rem; }
    .zone-row .zp { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--swim); white-space: nowrap; }
    .zone-row .zr { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .css-box { background: var(--surface-2); border: 1px dashed var(--border); border-radius: 10px; padding: 0.75rem 0.9rem; font-size: 0.78rem; color: var(--muted); margin-top: 0.5rem; }
    .css-box b { color: var(--text); }
    .tmpl { margin-top: 0.9rem; }
    .tmpl h4 { font-size: 0.82rem; font-weight: 650; }
    .tmpl h4 small { color: var(--faint); font-weight: 400; margin-left: 0.4rem; }
    .tmpl ul { list-style: none; margin-top: 0.35rem; }
    .tmpl li { font-size: 0.78rem; color: var(--muted); padding: 0.22rem 0 0.22rem 1rem; position: relative; }
    .tmpl li::before { content: '▸'; position: absolute; left: 0; color: var(--swim); }

    /* Strength split */
    .split-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    @media (max-width: 820px) { .split-grid { grid-template-columns: 1fr; } }
    .split-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.15rem; border-top: 3px solid var(--strength); }
    .split-card .sh { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
    .split-card .sh h3 { font-size: 1.05rem; font-weight: 700; color: var(--strength); }
    .split-card .sh .slot { font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); background: var(--surface-2); padding: 0.15rem 0.5rem; border-radius: 5px; white-space: nowrap; }
    .split-card .sf { font-size: 0.72rem; color: var(--muted); margin: 0.25rem 0 0.7rem; line-height: 1.4; }
    .split-card ul { list-style: none; }
    .split-card li { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; font-size: 0.78rem; padding: 0.34rem 0; border-bottom: 1px solid var(--border); }
    .split-card li:last-child { border-bottom: none; }
    .split-card li .ln { color: var(--text); line-height: 1.3; }
    .split-card li .ln .tag { display: block; font-size: 0.65rem; color: var(--faint); margin-top: 0.05rem; }
    .split-card li .ls { color: var(--strength); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .split-card li .ls.hi { color: var(--amber); }

    .callout { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--amber); border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.8rem; color: var(--muted); margin-top: 1rem; }

    .footer { text-align: center; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--faint); font-size: 0.78rem; }
    .footer a.btn { display: inline-block; color: var(--accent); text-decoration: none; font-weight: 600; border: 1px solid var(--border); padding: 0.4rem 1rem; border-radius: 100px; margin-bottom: 0.9rem; }
    .footer a.btn:hover { border-color: var(--accent); }
    .err { background: rgba(240,120,95,0.1); border: 1px solid rgba(240,120,95,0.3); color: #f5b9aa; padding: 1rem; border-radius: 12px; margin-top: 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="brand">
      <div>
        <h1>Project <span>Ironman</span></h1>
        <div class="sub" id="subtitle">Loading…</div>
      </div>
    </div>
    <div class="legend">
      <span class="pill"><span class="swatch" style="background:var(--swim)"></span>Swim</span>
      <span class="pill"><span class="swatch" style="background:var(--bike)"></span>Bike</span>
      <span class="pill"><span class="swatch" style="background:var(--run)"></span>Run</span>
      <span class="pill"><span class="swatch" style="background:var(--strength)"></span>Strength</span>
      <div class="weeknav" id="weeknav"><span class="weekchip">Week —</span></div>
    </div>
  </div>

  <div id="app"></div>

  <div class="footer">
    Project Ironman · <span id="updated"></span> · driven by <code>training/plan-him.json</code>
  </div>
</div>

<script>
(function() {
  "use strict";
  var WEEK_MS = 604800000;
  var DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k === "style") n.setAttribute("style", attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c) { if (c == null) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function h2(label) { return el("h2", {}, [label, el("span", { class: "rule" })]); }
  function daysUntil(dateStr) { return Math.ceil((new Date(dateStr).getTime() - Date.now()) / 86400000); }
  function fmtDate(s) { var d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString("en-IN", { month: "short", day: "numeric", year: "numeric" }); }
  function fmtShort(s) { var d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString("en-IN", { month: "short", day: "numeric" }); }

  function currentBlockWeek(data) {
    var start = new Date(data.meta.block_start).getTime();
    var diff = Date.now() - start;
    if (diff < 0) return 1;
    return Math.max(1, Math.min(data.meta.block_weeks, Math.floor(diff / WEEK_MS) + 1));
  }
  function phaseFor(wk, phases) {
    for (var i = 0; i < phases.length; i++) if (wk >= phases[i].weeks[0] && wk <= phases[i].weeks[1]) return phases[i];
    return phases[phases.length - 1];
  }
  function todayIndex(data) {
    // 0=Mon..6=Sun; only meaningful once the block has started
    if (Date.now() < new Date(data.meta.block_start).getTime()) return -1;
    var d = new Date().getDay(); // 0=Sun..6=Sat
    return d === 0 ? 6 : d - 1;
  }

  function swimTargetFor(s, wkData, data) {
    if (!s.swim_id || !wkData.swim || !wkData.swim.reps || !data.swim_sessions) return "aerobic swim";
    var def = null;
    for (var i = 0; i < data.swim_sessions.length; i++) if (data.swim_sessions[i].id === s.swim_id) def = data.swim_sessions[i];
    if (!def) return "aerobic swim";
    var n = wkData.swim.reps[def.scaled.key];
    if (n == null) return def.name;
    var main = def.scaled.label.replace("{n}", n);
    var easy = (wkData.swim.reps.deload && s.swim_id === "S3") ? " (easy)" : "";
    return def.name + " · " + main + easy;
  }

  function sessTarget(day, s, wkData, data) {
    if (!wkData) return s.detail;
    if (s.sport === "run") {
      if (day === "Sun") return "HR ≤172 · " + wkData.run.long_km + "k — " + wkData.run.long_note;
      if (day === "Wed") return wkData.run.speed;
      if (day === "Mon") return "HR ≤150–158 · ~" + wkData.run.easy_km + "k";
    }
    if (s.sport === "swim") return swimTargetFor(s, wkData, data);
    if (s.sport === "strength") {
      if (s.title.indexOf("Anterior") !== -1) return "chest · quads · arms · bench " + wkData.strength.bench;
      if (s.title.indexOf("Posterior") !== -1) return "back · hams · triceps · rear delt";
      if (s.title.indexOf("Upper") !== -1) return "2nd bench · back-heavy · arms";
      return s.detail;
    }
    return s.detail;
  }

  function findActual(wkData, day, s) {
    if (!wkData || !wkData.actuals) return null;
    for (var i = 0; i < wkData.actuals.length; i++) {
      var a = wkData.actuals[i];
      if (a.day === day && a.sport === s.sport && (a.slot == null || a.slot === s.slot)) return a;
    }
    return null;
  }
  function statusBadge(a) {
    if (a.badge) return a.badge;
    return a.status; // "done" / "missed" / "modified"
  }

  function renderThisWeek(data, wk, curWk) {
    var wkData = null;
    for (var i = 0; i < data.block.length; i++) if (data.block[i].week === wk) wkData = data.block[i];
    var phase = phaseFor(wk, data.phases);
    var isCurrent = wk === curWk;
    var tIdx = isCurrent ? todayIndex(data) : -1;
    var sec = el("div", { class: "section", id: "thisweek" });
    var heading = isCurrent ? "This Week" : (wk < curWk ? "Week " + wk + " — recap" : "Week " + wk + " — planned");
    sec.appendChild(h2(heading));

    var head = el("div", { class: "week-head" });
    head.appendChild(el("div", { class: "phase", html: "Phase " + phase.id + " — " + phase.name + (wkData && wkData.deload ? " <small>· deload week</small>" : "") }));
    if (wkData) {
      head.appendChild(el("div", { class: "focus", html:
        '<span class="sp">Run</span> long ' + wkData.run.long_km + 'k · speed ' + wkData.run.speed +
        ' &nbsp;·&nbsp; <span class="sw">Swim</span> ' + (wkData.swim.total_m / 1000).toFixed(1) + 'k this week' }));
    }
    sec.appendChild(head);

    var template = (wk >= 3 && data.week_template_full) ? data.week_template_full : data.week_template;
    var grid = el("div", { class: "week-grid" });
    template.forEach(function(t, idx) {
      var isToday = idx === tIdx;
      var primary = t.sessions[0].sport;
      var day = el("div", { class: "day" + (isToday ? " today" : ""), style: "--sport:var(--" + primary + ")" });
      day.appendChild(el("div", { class: "dow" }, [ el("span", { text: t.day }), isToday ? el("span", { class: "now", text: "TODAY" }) : null ]));
      var sessions = el("div", { class: "sessions" });
      t.sessions.forEach(function(s) {
        var act = findActual(wkData, t.day, s);
        var sess = el("div", { class: "sess" + (act && act.status ? " " + act.status : ""), style: "--sport:var(--" + s.sport + ")" });
        sess.appendChild(el("div", { class: "sess-head" }, [
          s.sport,
          s.slot ? el("span", { class: "slot", text: s.slot }) : null,
          act && act.status ? el("span", { class: "sess-status " + act.status, text: statusBadge(act) }) : null
        ]));
        sess.appendChild(el("div", { class: "sess-ttl", text: s.title }));
        sess.appendChild(el("div", { class: "sess-tgt", text: (act && act.tgt) ? act.tgt : sessTarget(t.day, s, wkData, data) }));
        sessions.appendChild(sess);
      });
      day.appendChild(sessions);
      grid.appendChild(day);
    });
    sec.appendChild(grid);
    if (wkData && wkData.swim.note) sec.appendChild(el("div", { class: "callout", html: "Swim note (wk " + wk + "): " + wkData.swim.note }));
    return sec;
  }

  function renderSessions(data) {
    if (!data.sessions || !data.sessions.length) return null;
    var sec = el("div", { class: "section" });
    sec.appendChild(h2("Session Log & Insights"));
    var list = el("div", { class: "log-list" });
    data.sessions.forEach(function(s, i) {
      var det = el("details", { class: "log", style: "--sport:var(--" + s.sport + ")" });
      if (i === 0) det.setAttribute("open", "");
      var sum = el("summary", {}, [
        el("span", { class: "ld", text: fmtShort(s.date) }),
        el("div", { class: "lt", html: s.title + "<small>" + (s.week ? "Wk " + s.week + " · " : "") + s.sport + "</small>" }),
        s.verdict ? el("span", { class: "lv", text: s.verdict }) : null,
        el("span", { class: "chev", text: "▸" })
      ]);
      det.appendChild(sum);
      var body = el("div", { class: "log-body" });
      if (s.stats && s.stats.length) {
        var st = el("div", { class: "log-stats" });
        s.stats.forEach(function(x) { st.appendChild(el("div", { class: "st", html: "<span>" + x.l + "</span><b>" + x.v + "</b>" })); });
        body.appendChild(st);
      }
      if (s.headline) body.appendChild(el("div", { class: "log-hl", text: s.headline }));
      if (s.insight && s.insight.length) {
        var ul = el("ul", { class: "log-insight" });
        s.insight.forEach(function(p) { ul.appendChild(el("li", { text: p })); });
        body.appendChild(ul);
      }
      det.appendChild(body);
      list.appendChild(det);
    });
    sec.appendChild(list);
    return sec;
  }

  function renderMetrics(data) {
    var sec = el("div", { class: "section" });
    sec.appendChild(h2("Metrics & Race Countdown"));
    var grid = el("div", { class: "grid-metrics" });
    data.metrics.forEach(function(m) {
      var card = el("div", { class: "metric", style: "--sport:var(--" + m.sport + ")" });
      card.appendChild(el("div", { class: "ml" }, [ el("span", { class: "dot" }), m.label ]));
      var mv = el("div", { class: "mv" }, [ m.value, m.unit ? el("span", { class: "u", text: m.unit }) : null, m.trend === "up" ? el("span", { class: "up", text: "↑" }) : null ]);
      card.appendChild(mv);
      if (m.target && m.from != null) {
        var pct = Math.max(6, Math.min(100, ((parseFloat(m.value) - 72.5) / (m.target - 72.5)) * 100));
        var bar = el("div", { class: "bar" }); bar.appendChild(el("span", { style: "width:" + pct + "%" })); card.appendChild(bar);
      }
      if (m.note) card.appendChild(el("div", { class: "mn", text: m.note }));
      grid.appendChild(card);
    });
    sec.appendChild(grid);

    var races = el("div", { class: "grid-races" });
    data.races.forEach(function(r) {
      var d = daysUntil(r.date);
      var weeks = Math.floor(d / 7);
      var race = el("div", { class: "race" });
      var rl = el("div", { class: "rl" });
      rl.appendChild(el("span", { class: "pri " + r.priority, text: r.priority === "A" ? "A-RACE" : "TARGET" }));
      rl.appendChild(el("div", { class: "rn", text: r.name }));
      rl.appendChild(el("div", { class: "rr", text: fmtDate(r.date) + " · " + r.role }));
      race.appendChild(rl);
      var cd = el("div", { class: "cd" });
      cd.appendChild(el("div", { class: "n", text: d > 0 ? (weeks >= 3 ? weeks : d) : "—" }));
      cd.appendChild(el("div", { class: "l", text: d > 0 ? (weeks >= 3 ? "weeks out" : "days out") : "done" }));
      race.appendChild(cd);
      races.appendChild(race);
    });
    sec.appendChild(races);
    return sec;
  }

  function renderStrength(data) {
    var sp = data.strength_split;
    if (!sp || !sp.days || !sp.days.length) return null;
    var sec = el("div", { class: "section" });
    sec.appendChild(h2("Strength — " + sp.framework + " split"));
    var grid = el("div", { class: "split-grid" });
    sp.days.forEach(function(d) {
      var card = el("div", { class: "split-card" });
      card.appendChild(el("div", { class: "sh" }, [
        el("h3", { text: d.name }),
        d.slot ? el("span", { class: "slot", text: d.slot }) : null
      ]));
      if (d.focus) card.appendChild(el("div", { class: "sf", text: d.focus }));
      var ul = el("ul");
      d.lifts.forEach(function(x) {
        var name = el("span", { class: "ln" }, [ x.n, x.tag ? el("span", { class: "tag", text: x.tag }) : null ]);
        var sets = el("span", { class: "ls" + (parseInt(x.s, 10) > 2 ? " hi" : ""), text: x.s + "×" });
        ul.appendChild(el("li", {}, [ name, sets ]));
      });
      card.appendChild(ul);
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    var notes = [sp.rule, sp.note, sp.volume_note].filter(Boolean);
    if (notes.length) sec.appendChild(el("div", { class: "callout", html: notes.join("<br>") }));
    return sec;
  }

  function renderSwim(data) {
    var sec = el("div", { class: "section" });
    sec.appendChild(h2("Swim — CSS & Pace Zones"));
    var cols = el("div", { class: "swim-cols" });

    var left = el("div", { class: "card" });
    left.appendChild(el("h3", { text: "Pace zones (per 100m)" }));
    data.swim.zones.forEach(function(z) {
      var row = el("div", { class: "zone-row" });
      row.appendChild(el("div", { class: "zl", html: z.label + "<small>" + z.use + "</small>" }));
      row.appendChild(el("div", {}, [ el("div", { class: "zp", text: z.pace }), el("div", { class: "zr", text: "RPE " + z.rpe }) ]));
      left.appendChild(row);
    });
    left.appendChild(el("div", { class: "css-box", html: "<b>CSS test:</b> " + data.swim.css_test }));
    cols.appendChild(left);

    var right = el("div", { class: "card" });
    if (data.swim_sessions && data.swim_sessions.length) {
      right.appendChild(el("h3", { text: "3-session week (from wk 3)" }));
      data.swim_sessions.forEach(function(ss) {
        var tm = el("div", { class: "tmpl" });
        tm.appendChild(el("h4", { html: ss.id + " — " + ss.name + "<small>" + ss.slot + " · " + ss.focus + "</small>" }));
        var ul = el("ul");
        ss.fixed.forEach(function(f) { ul.appendChild(el("li", { text: f })); });
        ul.appendChild(el("li", { html: "<b>main: " + ss.scaled.label.replace("{n}", "N") + "</b> — " + ss.scaled.range }));
        tm.appendChild(ul);
        right.appendChild(tm);
      });
    } else {
      right.appendChild(el("h3", { text: "Session templates" }));
      data.swim.templates.forEach(function(t) {
        var tm = el("div", { class: "tmpl" });
        tm.appendChild(el("h4", { html: t.title + "<small>" + t.role + "</small>" }));
        var ul = el("ul"); t.sets.forEach(function(s) { ul.appendChild(el("li", { text: s })); });
        tm.appendChild(ul);
        right.appendChild(tm);
      });
    }
    cols.appendChild(right);
    sec.appendChild(cols);
    return sec;
  }

  function renderBlock(data, wk) {
    var sec = el("div", { class: "section" });
    sec.appendChild(h2("The Block — " + data.meta.block_name));

    var bands = el("div", { class: "phase-bands" });
    var curPhase = phaseFor(wk, data.phases);
    data.phases.forEach(function(p) {
      var band = el("div", { class: "band" + (p.id === curPhase.id ? " active" : "") });
      band.appendChild(el("div", { class: "bp", text: "Phase " + p.id + " · wk " + p.weeks[0] + "–" + p.weeks[1] }));
      band.appendChild(el("div", { class: "bn", text: p.name }));
      band.appendChild(el("div", { class: "bnote", text: p.note }));
      bands.appendChild(band);
    });
    sec.appendChild(bands);

    var charts = el("div", { class: "charts" });
    var c1 = el("div", { class: "chart-card" });
    c1.appendChild(el("h3", { html: '<span class="swatch" style="width:9px;height:9px;border-radius:3px;background:var(--run);display:inline-block"></span> Long-run build (km)' }));
    c1.appendChild(el("canvas", { id: "runChart" }));
    charts.appendChild(c1);
    var c2 = el("div", { class: "chart-card" });
    c2.appendChild(el("h3", { html: '<span class="swatch" style="width:9px;height:9px;border-radius:3px;background:var(--swim);display:inline-block"></span> Swim volume ramp (km/wk)' }));
    c2.appendChild(el("canvas", { id: "swimChart" }));
    charts.appendChild(c2);
    sec.appendChild(charts);

    var wrap = el("div", { class: "table-wrap" });
    var table = el("table");
    table.appendChild(el("thead", {}, [ el("tr", {}, [
      el("th", { text: "Wk" }), el("th", { text: "Phase" }), el("th", { text: "Long run" }),
      el("th", { text: "Speed" }), el("th", { text: "Swim" }), el("th", { text: "Bench" }), el("th", { text: "Long-run note" })
    ]) ]));
    var tb = el("tbody");
    data.block.forEach(function(b) {
      var cls = b.deload ? "deload" : (b.week === wk ? "current" : (b.week < wk ? "past" : ""));
      var tr = el("tr", cls ? { class: cls } : {});
      var wkCell = el("td", {}, [ el("strong", { text: "W" + b.week }) ]);
      if (b.week === wk) wkCell.appendChild(el("span", { class: "badge now", text: "NOW" }));
      else if (b.deload) wkCell.appendChild(el("span", { class: "badge dl", text: "DL" }));
      tr.appendChild(wkCell);
      tr.appendChild(el("td", { text: b.phase }));
      tr.appendChild(el("td", {}, [ el("span", { class: "sp", text: b.run.long_km + " km" }) ]));
      tr.appendChild(el("td", { text: b.run.speed }));
      tr.appendChild(el("td", {}, [ el("span", { class: "sw", text: (b.swim.total_m / 1000).toFixed(1) + "k" }) ]));
      tr.appendChild(el("td", { text: b.strength.bench }));
      tr.appendChild(el("td", { text: b.run.long_note }));
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    wrap.appendChild(table);
    sec.appendChild(wrap);
    sec.appendChild(el("div", { class: "callout", html: "→ " + data.next_phase_note }));
    return sec;
  }

  function drawCharts(data, wk) {
    if (typeof Chart === "undefined") return;
    var muted = "#8ba3b8", grid = "rgba(138,163,184,0.12)";
    var labels = data.block.map(function(b) { return "W" + b.week; });
    var runColors = data.block.map(function(b) { return b.deload ? "rgba(251,191,36,0.55)" : (b.week <= wk ? "rgba(74,222,128,0.9)" : "rgba(74,222,128,0.32)"); });
    new Chart(document.getElementById("runChart"), {
      type: "bar",
      data: { labels: labels, datasets: [{ label: "Long run", data: data.block.map(function(b) { return b.run.long_km; }), backgroundColor: runColors, borderRadius: 4 }] },
      options: { responsive: true, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: muted, font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: muted }, grid: { color: grid }, suggestedMax: 22, title: { display: true, text: "km", color: muted } } } }
    });
    new Chart(document.getElementById("swimChart"), {
      type: "line",
      data: { labels: labels, datasets: [{ label: "Swim km", data: data.block.map(function(b) { return b.swim.total_m / 1000; }),
        borderColor: "#22d3ee", backgroundColor: "rgba(34,211,238,0.14)", fill: true, tension: 0.35,
        pointRadius: data.block.map(function(b) { return b.week === wk ? 6 : 3; }),
        pointBackgroundColor: data.block.map(function(b) { return b.deload ? "#fbbf24" : "#22d3ee"; }) }] },
      options: { responsive: true, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: muted, font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: muted }, grid: { color: grid }, suggestedMin: 3, suggestedMax: 7.5, title: { display: true, text: "km / week", color: muted } } } }
    });
  }

  fetch(appUrl("training/plan-him.json")).then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(data) {
    var wk = currentBlockWeek(data);
    var viewWk = wk;
    document.getElementById("subtitle").textContent = data.meta.subtitle;
    document.getElementById("updated").textContent = "updated " + fmtDate(data.meta.updated);

    var weeknav = document.getElementById("weeknav");
    function renderWeekNav() {
      weeknav.innerHTML = "";
      var prev = el("button", { type: "button", "aria-label": "Previous week" }, ["‹"]);
      prev.disabled = viewWk <= 1;
      prev.onclick = function() { if (viewWk > 1) { viewWk--; refreshWeek(); } };
      var chip = el("span", { class: "weekchip" + (viewWk !== wk ? " other" : ""),
        title: viewWk !== wk ? "Back to current week" : "" }, ["Week " + viewWk + " / " + data.meta.block_weeks]);
      if (viewWk !== wk) chip.onclick = function() { viewWk = wk; refreshWeek(); };
      var next = el("button", { type: "button", "aria-label": "Next week" }, ["›"]);
      next.disabled = viewWk >= data.meta.block_weeks;
      next.onclick = function() { if (viewWk < data.meta.block_weeks) { viewWk++; refreshWeek(); } };
      weeknav.appendChild(prev); weeknav.appendChild(chip); weeknav.appendChild(next);
    }
    function refreshWeek() {
      renderWeekNav();
      var fresh = renderThisWeek(data, viewWk, wk);
      var old = document.getElementById("thisweek");
      old.parentNode.replaceChild(fresh, old);
    }
    renderWeekNav();

    var app = document.getElementById("app");
    app.appendChild(renderThisWeek(data, viewWk, wk));
    var logSec = renderSessions(data);
    if (logSec) app.appendChild(logSec);
    app.appendChild(renderMetrics(data));
    app.appendChild(renderBlock(data, wk));
    var strSec = renderStrength(data);
    if (strSec) app.appendChild(strSec);
    app.appendChild(renderSwim(data));
    drawCharts(data, wk);
  }).catch(function(err) {
    document.getElementById("app").appendChild(el("div", { class: "err",
      text: "Could not load training/plan-him.json — " + (err && err.message ? err.message : err) + ". On GitHub Pages, ensure the file is deployed (Pages → main branch / root)." }));
    document.getElementById("subtitle").textContent = "Load error";
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register(appUrl("sw.js?v=12")).catch(function() {}); }
</script>
</body>
